    <!-- Apply saved theme before React mounts to prevent flash -->
    <script>
      (function() {
        var saved = localStorage.getItem('portfolio-theme');
        var valid = ['dark','light','midnight','forest'];
        document.documentElement.setAttribute('data-theme', valid.includes(saved) ? saved : 'dark');
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
